    <linearGradient id="paper" x1="0" x2="1"><stop stop-color="#38649E"/><stop offset=".5" stop-color="#5F8CC7"/><stop offset="1" stop-color="#38649E"/></linearGradient>
    <filter id="softGlow" x="-130%" y="-80%" width="360%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="beamGlow" x="-80%" y="-500%" width="260%" height="1100%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <path d="M0 44h430M770 44h430" stroke="#8099B9" opacity=".52"/>
