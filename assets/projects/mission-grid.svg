    <linearGradient id="g"><stop stop-color="#D8A25E"/><stop offset=".5" stop-color="#72878A"/><stop offset="1" stop-color="#C46D48"/></linearGradient>
    <style>text{font-family:Georgia,'Times New Roman',serif}.led{animation:b 5s ease-in-out infinite}.d{animation-delay:2.5s}@keyframes b{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.led{animation:none}}</style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#1D1714"/><rect x="2" y="2" width="1196" height="646" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
