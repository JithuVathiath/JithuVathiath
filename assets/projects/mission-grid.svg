<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Selected projects</title><desc id="desc">Six selected projects across responsible AI, credit risk, market simulation, AI assurance, market data engineering and information retrieval.</desc>
  <defs><linearGradient id="g"><stop stop-color="#D8A25E"/><stop offset=".5" stop-color="#596C78"/><stop offset="1" stop-color="#C46D48"/></linearGradient><style>text{font-family:Georgia,'Times New Roman',serif}.led{animation:b 5s ease-in-out infinite}.d{animation-delay:2.5s}@keyframes b{50%{opacity:.58}}@media(prefers-reduced-motion:reduce){.led{animation:none}}</style></defs>
  <rect width="1200" height="650" rx="18" fill="#1D1714"/><rect x="2" y="2" width="1196" height="646" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
