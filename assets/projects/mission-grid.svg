  <text x="42" y="88" fill="#FFF4E5" font-size="24" font-weight="700">Research questions translated into tested and documented software</text>
  <g transform="translate(42 120)">
    <g><rect width="352" height="220" rx="12" fill="#493229" stroke="#DDA15E"/><circle class="led" cx="322" cy="27" r="5" fill="#A8B68F"/><text x="20" y="31" fill="#FFD08A" font-size="12">PROJECT 01 · RESPONSIBLE AI</text><text x="20" y="67" fill="#FFF5E6" font-size="18" font-weight="700">HUMAN-AI LOAN</text><text x="20" y="91" fill="#FFF5E6" font-size="18" font-weight="700">COLLABORATION</text><text x="20" y="128" fill="#EAD8C2" font-size="13">22 participants · 2,200 rows</text><text x="20" y="153" fill="#EAD8C2" font-size="13">reliance · fairness · oversight</text><text x="20" y="188" fill="#FFD08A" font-size="12">PYTHON · MIXED METHODS · SHAP</text></g>
    <g transform="translate(382)"><rect width="352" height="220" rx="12" fill="#293C3E" stroke="#84A3A6"/><circle class="led d" cx="322" cy="27" r="5" fill="#E7B778"/><text x="20" y="31" fill="#BFD3D2" font-size="12">PROJECT 02 · FINANCIAL ML</text><text x="20" y="67" fill="#FFF5E6" font-size="18" font-weight="700">SBA CREDIT-RISK</text><text x="20" y="91" fill="#FFF5E6" font-size="18" font-weight="700">BENCHMARK</text><text x="20" y="128" fill="#DCE8E4" font-size="13">514,825 eligible loans</text><text x="20" y="153" fill="#DCE8E4" font-size="13">temporal validation · calibration</text><text x="20" y="188" fill="#FFD08A" font-size="12">PYTHON · CATBOOST · DOCKER</text></g>
