<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Selected projects</title><desc id="desc">Six evenly aligned warm-toned project cards across responsible AI, credit risk, market simulation, AI assurance, market data engineering and information retrieval.</desc>
  <defs>
    <linearGradient id="g"><stop stop-color="#6EB6FF"/><stop offset=".5" stop-color="#72878A"/><stop offset="1" stop-color="#4DA7DB"/></linearGradient>
    <style>text{font-family:Arial,Helvetica,sans-serif}.led{animation:b 5s ease-in-out infinite}.d{animation-delay:2.5s}@keyframes b{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.led{animation:none}}</style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="#0B1629"/><rect x="2" y="2" width="1196" height="646" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
  <text x="42" y="54" fill="#7BA0D1" font-size="15" letter-spacing="3">SELECTED PROJECTS · RESEARCH &amp; ENGINEERING</text>
  <text x="42" y="88" fill="#ECF1F8" font-size="24" font-weight="700">Research questions translated into tested and documented software</text>
  <g transform="translate(42 120)">
    <g><rect width="352" height="220" rx="12" fill="#293749" stroke="#6F97CC"/><circle class="led" cx="322" cy="27" r="5" fill="#8FA0B6"/><text x="20" y="31" fill="#A8C1E1" font-size="12">PROJECT 01 · RESPONSIBLE AI</text><text x="20" y="67" fill="#ECF2F8" font-size="18" font-weight="700">HUMAN-AI LOAN</text><text x="20" y="91" fill="#ECF2F8" font-size="18" font-weight="700">COLLABORATION</text><text x="20" y="128" fill="#C2D3EA" font-size="13">22 participants · 2,200 rows</text><text x="20" y="153" fill="#C2D3EA" font-size="13">reliance · fairness · oversight</text><text x="20" y="188" fill="#A8C1E1" font-size="12">PYTHON · MIXED METHODS · SHAP</text></g>
    <g transform="translate(382)"><rect width="352" height="220" rx="12" fill="#293C3E" stroke="#84A3A6"/><circle class="led d" cx="322" cy="27" r="5" fill="#89AAD6"/><text x="20" y="31" fill="#BFC8D3" font-size="12">PROJECT 02 · FINANCIAL ML</text><text x="20" y="67" fill="#ECF2F8" font-size="18" font-weight="700">SBA CREDIT-RISK</text><text x="20" y="91" fill="#ECF2F8" font-size="18" font-weight="700">BENCHMARK</text><text x="20" y="128" fill="#DCE1E8" font-size="13">514,825 eligible loans</text><text x="20" y="153" fill="#DCE1E8" font-size="13">temporal validation · calibration</text><text x="20" y="188" fill="#A8C1E1" font-size="12">PYTHON · CATBOOST · DOCKER</text></g>
    <g transform="translate(764)"><rect width="352" height="220" rx="12" fill="#24344A" stroke="#769CCF"/><circle class="led" cx="322" cy="27" r="5" fill="#8FA0B6"/><text x="20" y="31" fill="#BBCEE7" font-size="12">PROJECT 03 · MARKET SIMULATION</text><text x="20" y="67" fill="#ECF2F8" font-size="17" font-weight="700">MARKET MICROSTRUCTURE</text><text x="20" y="91" fill="#ECF2F8" font-size="18" font-weight="700">CRISIS LAB</text><text x="20" y="128" fill="#C5D5EB" font-size="13">exchange replay · policy analysis</text><text x="20" y="153" fill="#C5D5EB" font-size="13">agents · latency · Monte Carlo</text><text x="20" y="188" fill="#A8C1E1" font-size="12">RUST · WASM · REACT</text></g>
    <g transform="translate(0 242)"><rect width="352" height="220" rx="12" fill="#303842" stroke="#9AA6B6"/><circle class="led d" cx="322" cy="27" r="5" fill="#89AAD6"/><text x="20" y="31" fill="#CBD5E2" font-size="12">PROJECT 04 · AI GOVERNANCE</text><text x="20" y="67" fill="#ECF2F8" font-size="18" font-weight="700">AI ASSURANCE CASE</text><text x="20" y="91" fill="#ECF2F8" font-size="18" font-weight="700">STRESS LAB</text><text x="20" y="128" fill="#DEE4EC" font-size="13">evidence graphs · cut sets</text><text x="20" y="153" fill="#DEE4EC" font-size="13">stress tests · tamper-evident audit</text><text x="20" y="188" fill="#A8C1E1" font-size="12">TYPESCRIPT · POLICY-AS-CODE</text></g>
    <g transform="translate(382 242)"><rect width="352" height="220" rx="12" fill="#303740" stroke="#8A9BB1"/><circle class="led" cx="322" cy="27" r="5" fill="#89AAD6"/><text x="20" y="31" fill="#B6C5D9" font-size="12">PROJECT 05 · DATA ENGINEERING</text><text x="20" y="67" fill="#ECF2F8" font-size="18" font-weight="700">MARKET SETTLEMENT</text><text x="20" y="91" fill="#ECF2F8" font-size="18" font-weight="700">FORENSICS</text><text x="20" y="128" fill="#D8DFE9" font-size="13">SEC FTD · lineage · contracts</text><text x="20" y="153" fill="#D8DFE9" font-size="13">114,067 validated records</text><text x="20" y="188" fill="#A8C1E1" font-size="12">SQL · POSTGRESQL · GO</text></g>
    <g transform="translate(764 242)"><rect width="352" height="220" rx="12" fill="#2C394A" stroke="#7098CD"/><circle class="led d" cx="322" cy="27" r="5" fill="#8FA0B6"/><text x="20" y="31" fill="#A1BBDE" font-size="12">PROJECT 06 · INFORMATION RETRIEVAL</text><text x="20" y="67" fill="#ECF2F8" font-size="18" font-weight="700">STRATA SEARCH ENGINE</text><text x="20" y="94" fill="#C2D3EA" font-size="13">from-scratch retrieval engine</text><text x="20" y="128" fill="#C2D3EA" font-size="13">BM25 · phrase · fuzzy · trie</text><text x="20" y="153" fill="#C2D3EA" font-size="13">compression · persistence · cache</text><text x="20" y="188" fill="#A8C1E1" font-size="12">C++20 · ZERO RUNTIME DEPS</text></g>
