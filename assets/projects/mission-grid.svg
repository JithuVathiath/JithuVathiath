    <g transform="translate(382 242)"><rect width="352" height="220" rx="12" fill="#304032" stroke="#9DB18A"/><circle class="led" cx="322" cy="27" r="5" fill="#E7B778"/><text x="20" y="31" fill="#C8D9B6" font-size="12">PROJECT 05 · DATA ENGINEERING</text><text x="20" y="67" fill="#FFF5E6" font-size="18" font-weight="700">MARKET SETTLEMENT</text><text x="20" y="91" fill="#FFF5E6" font-size="18" font-weight="700">FORENSICS</text><text x="20" y="128" fill="#E1E9D8" font-size="13">SEC FTD · lineage · contracts</text><text x="20" y="153" fill="#E1E9D8" font-size="13">114,067 validated records</text><text x="20" y="188" fill="#FFD08A" font-size="12">SQL · POSTGRESQL · GO</text></g>
    <g transform="translate(764 242)"><rect width="352" height="220" rx="12" fill="#4A302C" stroke="#D58A68"/><circle class="led d" cx="322" cy="27" r="5" fill="#A8B68F"/><text x="20" y="31" fill="#F0B08F" font-size="12">PROJECT 06 · INFORMATION RETRIEVAL</text><text x="20" y="67" fill="#FFF5E6" font-size="18" font-weight="700">STRATA SEARCH ENGINE</text><text x="20" y="94" fill="#EAD8C2" font-size="13">from-scratch retrieval engine</text><text x="20" y="128" fill="#EAD8C2" font-size="13">BM25 · phrase · fuzzy · trie</text><text x="20" y="153" fill="#EAD8C2" font-size="13">compression · persistence · cache</text><text x="20" y="188" fill="#FFD08A" font-size="12">C++20 · ZERO RUNTIME DEPS</text></g>
