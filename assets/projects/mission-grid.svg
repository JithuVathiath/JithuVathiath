    <g transform="translate(0 242)"><rect width="348" height="220" rx="12" fill="#2B241F" stroke="#B56A3C"/><circle class="led d" cx="318" cy="27" r="5" fill="#85966D"/><text x="20" y="31" fill="#6F8791" font-size="12">PROJECT 04 · AI GOVERNANCE</text><text x="20" y="67" fill="#F4EADB" font-size="18" font-weight="700">AI ASSURANCE CASE</text><text x="20" y="91" fill="#F4EADB" font-size="18" font-weight="700">STRESS LAB</text><text x="20" y="128" fill="#A89E8C" font-size="13">evidence graphs · cut sets</text><text x="20" y="153" fill="#A89E8C" font-size="13">stress tests · tamper-evident audit</text><text x="20" y="188" fill="#D28B66" font-size="12">TYPESCRIPT · POLICY-AS-CODE</text></g>
    <g transform="translate(370 242)"><rect width="348" height="220" rx="12" fill="#2B241F" stroke="#85966D"/><circle class="led" cx="318" cy="27" r="5" fill="#85966D"/><text x="20" y="31" fill="#9CAB83" font-size="12">PROJECT 05 · DATA ENGINEERING</text><text x="20" y="67" fill="#F4EADB" font-size="18" font-weight="700">MARKET SETTLEMENT</text><text x="20" y="91" fill="#F4EADB" font-size="18" font-weight="700">FORENSICS</text><text x="20" y="128" fill="#A89E8C" font-size="13">SEC FTD · lineage · contracts</text><text x="20" y="153" fill="#A89E8C" font-size="13">114,067 validated records</text><text x="20" y="188" fill="#D28B66" font-size="12">SQL · POSTGRESQL · GO</text></g>
    <g transform="translate(740 242)"><rect width="376" height="220" rx="12" fill="#2B241F" stroke="#D8A25E"/><circle class="led d" cx="346" cy="27" r="5" fill="#85966D"/><text x="20" y="31" fill="#D8A25E" font-size="12">PROJECT 06 · INFORMATION RETRIEVAL</text><text x="20" y="67" fill="#F4EADB" font-size="18" font-weight="700">STRATA SEARCH ENGINE</text><text x="20" y="91" fill="#7C756D" font-size="13">from-scratch retrieval engine</text><text x="20" y="128" fill="#A89E8C" font-size="13">BM25 · phrase · fuzzy · trie</text><text x="20" y="153" fill="#A89E8C" font-size="13">compression · persistence · cache</text><text x="20" y="188" fill="#D28B66" font-size="12">C++20 · ZERO RUNTIME DEPS</text></g>
