  <text x="42" y="88" fill="#F4EADB" font-size="24" font-weight="700">Research questions translated into tested and documented software</text>
  <g transform="translate(42 120)">
    <g><rect width="348" height="220" rx="12" fill="#2B241F" stroke="#D8A25E"/><circle class="led" cx="318" cy="27" r="5" fill="#85966D"/><text x="20" y="31" fill="#D8A25E" font-size="12">PROJECT 01 · RESPONSIBLE AI</text><text x="20" y="67" fill="#F4EADB" font-size="18" font-weight="700">HUMAN-AI LOAN</text><text x="20" y="91" fill="#F4EADB" font-size="18" font-weight="700">COLLABORATION</text><text x="20" y="128" fill="#A89E8C" font-size="13">22 participants · 2,200 rows</text><text x="20" y="153" fill="#A89E8C" font-size="13">reliance · fairness · oversight</text><text x="20" y="188" fill="#D28B66" font-size="12">PYTHON · MIXED METHODS · SHAP</text></g>
    <g transform="translate(370)"><rect width="348" height="220" rx="12" fill="#2B241F" stroke="#596C78"/><circle class="led d" cx="318" cy="27" r="5" fill="#85966D"/><text x="20" y="31" fill="#8E9682" font-size="12">PROJECT 02 · FINANCIAL ML</text><text x="20" y="67" fill="#F4EADB" font-size="18" font-weight="700">SBA CREDIT-RISK</text><text x="20" y="91" fill="#F4EADB" font-size="18" font-weight="700">BENCHMARK</text><text x="20" y="128" fill="#A89E8C" font-size="13">514,825 eligible loans</text><text x="20" y="153" fill="#A89E8C" font-size="13">temporal validation · calibration</text><text x="20" y="188" fill="#D28B66" font-size="12">PYTHON · CATBOOST · DOCKER</text></g>
