<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Technical expertise</title><desc id="desc">Five aligned warm-toned panels for languages, machine learning, data systems, software platforms and research engineering evidenced by public repositories.</desc>
  <defs><linearGradient id="g"><stop stop-color="#D8A25E"/><stop offset=".55" stop-color="#72878A"/><stop offset="1" stop-color="#C46D48"/></linearGradient><style>text{font-family:Georgia,'Times New Roman',serif}.p{animation:p 5s ease-in-out infinite}@keyframes p{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs>
  <rect width="1200" height="470" rx="18" fill="#1D1714"/><rect x="2" y="2" width="1196" height="466" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
  <text x="42" y="54" fill="#E4AE68" font-size="15" letter-spacing="3">TECHNICAL EXPERTISE · EVIDENCED BY PUBLIC WORK</text>
  <text x="42" y="88" fill="#FFF4E5" font-size="24" font-weight="700">Research, machine learning, data and software engineering</text>
  <g transform="translate(42 122)">
    <g><rect width="352" height="128" rx="12" fill="#493229" stroke="#DDA15E"/><text x="20" y="30" fill="#FFD08A" font-size="13">PROGRAMMING LANGUAGES</text><text x="20" y="64" fill="#FFF5E6" font-size="17">Python · TypeScript · SQL</text><text x="20" y="92" fill="#EAD8C2" font-size="16">Rust · Go · C++20 · Swift</text><text x="20" y="114" fill="#D8BDA5" font-size="12">Bash · JavaScript</text></g>
    <g transform="translate(382)"><rect width="352" height="128" rx="12" fill="#293C3E" stroke="#84A3A6"/><text x="20" y="30" fill="#BFD3D2" font-size="13">AI &amp; MACHINE LEARNING</text><text x="20" y="64" fill="#FFF5E6" font-size="17">scikit-learn · PyTorch</text><text x="20" y="92" fill="#DCE8E4" font-size="16">CatBoost · SHAP · Qiskit</text><text x="20" y="114" fill="#BFD3D2" font-size="12">calibration · selective prediction</text></g>
    <g transform="translate(764)"><rect width="352" height="128" rx="12" fill="#4A3924" stroke="#D9B36C"/><text x="20" y="30" fill="#FFE0A3" font-size="13">DATA SYSTEMS</text><text x="20" y="64" fill="#FFF5E6" font-size="17">PostgreSQL · PostGIS · pandas</text><text x="20" y="92" fill="#F0DEC0" font-size="15">NumPy · Jupyter · data contracts</text><text x="20" y="114" fill="#D9C49E" font-size="12">lineage · validation · reproducibility</text></g>
    <g transform="translate(0 150)"><rect width="543" height="128" rx="12" fill="#3B3042" stroke="#A99AB6"/><text x="20" y="30" fill="#D7CBE2" font-size="13">SOFTWARE &amp; PLATFORMS</text><text x="20" y="64" fill="#FFF5E6" font-size="17">React · WebAssembly · FastAPI · Node.js</text><text x="20" y="92" fill="#E8DEEC" font-size="16">Docker · GitHub Actions · REST · CLI systems</text><text x="20" y="114" fill="#C9BAD1" font-size="12">Vitest · pytest · Playwright · CMake · SwiftPM</text></g>
    <g transform="translate(573 150)"><rect width="543" height="128" rx="12" fill="#304032" stroke="#9DB18A"/><text x="20" y="30" fill="#C8D9B6" font-size="13">RESEARCH METHODS &amp; ENGINEERING</text><text x="20" y="64" fill="#FFF5E6" font-size="17">mixed methods · bootstrap intervals · Monte Carlo</text><text x="20" y="92" fill="#E1E9D8" font-size="16">fairness evaluation · explainability · stress testing</text><text x="20" y="114" fill="#B8C6A9" font-size="12">audit trails · provenance · deterministic replay</text></g>
  </g>
  <circle class="p" cx="1158" cy="38" r="5" fill="#D8A25E"/>
