<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Technical expertise</title><desc id="desc">Five aligned warm-toned panels for languages, machine learning, data systems, software platforms and research engineering evidenced by public repositories.</desc>
  <defs><linearGradient id="g"><stop stop-color="#6EB6FF"/><stop offset=".55" stop-color="#72878A"/><stop offset="1" stop-color="#4DA7DB"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.p{animation:p 5s ease-in-out infinite}@keyframes p{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs>
  <rect width="1200" height="470" rx="18" fill="#0B1629"/><rect x="2" y="2" width="1196" height="466" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
  <text x="42" y="54" fill="#7BA0D1" font-size="15" letter-spacing="3">TECHNICAL EXPERTISE · EVIDENCED BY PUBLIC WORK</text>
  <text x="42" y="88" fill="#ECF1F8" font-size="24" font-weight="700">Research, machine learning, data and software engineering</text>
  <g transform="translate(42 122)">
    <g><rect width="352" height="128" rx="12" fill="#293749" stroke="#6F97CC"/><text x="20" y="30" fill="#A8C1E1" font-size="13">PROGRAMMING LANGUAGES</text><text x="20" y="64" fill="#ECF2F8" font-size="17">Python · TypeScript · SQL</text><text x="20" y="92" fill="#C2D3EA" font-size="16">Rust · Go · C++20 · Swift</text><text x="20" y="114" fill="#A5BBD8" font-size="12">Bash · JavaScript</text></g>
    <g transform="translate(382)"><rect width="352" height="128" rx="12" fill="#293C3E" stroke="#84A3A6"/><text x="20" y="30" fill="#BFC8D3" font-size="13">AI &amp; MACHINE LEARNING</text><text x="20" y="64" fill="#ECF2F8" font-size="17">scikit-learn · PyTorch</text><text x="20" y="92" fill="#DCE1E8" font-size="16">CatBoost · SHAP · Qiskit</text><text x="20" y="114" fill="#BFC8D3" font-size="12">calibration · selective prediction</text></g>
    <g transform="translate(764)"><rect width="352" height="128" rx="12" fill="#24344A" stroke="#769CCF"/><text x="20" y="30" fill="#BBCEE7" font-size="13">DATA SYSTEMS</text><text x="20" y="64" fill="#ECF2F8" font-size="17">PostgreSQL · PostGIS · pandas</text><text x="20" y="92" fill="#C5D5EB" font-size="15">NumPy · Jupyter · data contracts</text><text x="20" y="114" fill="#9EB7D9" font-size="12">lineage · validation · reproducibility</text></g>
    <g transform="translate(0 150)"><rect width="543" height="128" rx="12" fill="#303842" stroke="#9AA6B6"/><text x="20" y="30" fill="#CBD5E2" font-size="13">SOFTWARE &amp; PLATFORMS</text><text x="20" y="64" fill="#ECF2F8" font-size="17">React · WebAssembly · FastAPI · Node.js</text><text x="20" y="92" fill="#DEE4EC" font-size="16">Docker · GitHub Actions · REST · CLI systems</text><text x="20" y="114" fill="#BAC4D1" font-size="12">Vitest · pytest · Playwright · CMake · SwiftPM</text></g>
    <g transform="translate(573 150)"><rect width="543" height="128" rx="12" fill="#303740" stroke="#8A9BB1"/><text x="20" y="30" fill="#B6C5D9" font-size="13">RESEARCH METHODS &amp; ENGINEERING</text><text x="20" y="64" fill="#ECF2F8" font-size="17">mixed methods · bootstrap intervals · Monte Carlo</text><text x="20" y="92" fill="#D8DFE9" font-size="16">fairness evaluation · explainability · stress testing</text><text x="20" y="114" fill="#A9B5C6" font-size="12">audit trails · provenance · deterministic replay</text></g>
