<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Public development workflow</title><desc id="desc">An abstract animated path linking source code, testing, evidence, review and release. It does not encode contribution counts.</desc>
  <defs><linearGradient id="g"><stop stop-color="#D8A25E"/><stop offset=".5" stop-color="#596C78"/><stop offset="1" stop-color="#C46D48"/></linearGradient><style>text{font-family:Georgia,'Times New Roman',serif}.path{stroke-dasharray:5 18;animation:f 7s linear infinite}.n{animation:p 5s ease-in-out infinite}.d1{animation-delay:1s}.d2{animation-delay:2s}.d3{animation-delay:3s}@keyframes f{to{stroke-dashoffset:-69}}@keyframes p{50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.path,.n{animation:none}}</style></defs>
  <rect width="1200" height="230" rx="18" fill="#1D1714"/><rect x="2" y="2" width="1196" height="226" rx="16" fill="none" stroke="#5C5146" stroke-width="2"/>
  <text x="42" y="50" fill="#D8A25E" font-size="15" letter-spacing="3">PUBLIC DEVELOPMENT WORKFLOW</text>
  <text x="42" y="78" fill="#7C756D" font-size="12">Source code, testing, evidence, review and release</text>
  <path class="path" d="M60 151H210l70-48 90 76 95-54 100 26 90-70 105 98 90-44 90 16h200" fill="none" stroke="url(#g)" stroke-width="4"/>
  <g fill="#D8A25E"><circle class="n" cx="210" cy="151" r="6"/><circle class="n d1" cx="370" cy="179" r="6" fill="#596C78"/><circle class="n d2" cx="565" cy="151" r="6" fill="#C46D48"/><circle class="n d3" cx="760" cy="179" r="6" fill="#85966D"/><circle class="n d1" cx="940" cy="151" r="6"/></g>
  <g fill="#A89E8C" font-size="12"><text x="174" y="202">SOURCE</text><text x="337" y="202">TEST</text><text x="528" y="202">EVIDENCE</text><text x="720" y="202">REVIEW</text><text x="900" y="202">RELEASE</text></g>
</svg>
