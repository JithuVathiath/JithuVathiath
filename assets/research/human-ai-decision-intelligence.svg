<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Human-AI collaboration research summary</title>
  <desc id="desc">A three-stage lending study with 22 participants and 2,200 decision rows: initial human decision, AI recommendation and final human decision.</desc>
  <defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#D8A25E"/><stop offset=".55" stop-color="#596C78"/><stop offset="1" stop-color="#C46D48"/></linearGradient><style>text{font-family:Georgia,'Times New Roman',serif}.signal{stroke-dasharray:10 18;animation:move 7s linear infinite}.n{animation:p 5s ease-in-out infinite}.d2{animation-delay:1.4s}@keyframes move{to{stroke-dashoffset:-84}}@keyframes p{50%{opacity:.55}}@media(prefers-reduced-motion:reduce){.signal,.n{animation:none}}</style></defs>
  <rect width="1200" height="430" rx="18" fill="#1D1714"/><rect x="2" y="2" width="1196" height="426" rx="16" fill="none" stroke="#5C5146" stroke-width="2"/>
  <text x="42" y="52" fill="#D8A25E" font-size="15" letter-spacing="3">HUMAN-AI COLLABORATION · LENDING DECISION STUDY</text>
  <text x="42" y="86" fill="#F4EADB" font-size="25" font-weight="700">How people use, resist and revise AI advice in lending decisions</text>
  <g transform="translate(42 118)">
    <rect width="220" height="78" rx="10" fill="#2B241F" stroke="#D8A25E"/><text x="20" y="31" fill="#A89E8C" font-size="14">PARTICIPANTS</text><text x="20" y="62" fill="#F4EADB" font-size="28" font-weight="700">22</text>
    <rect x="240" width="220" height="78" rx="10" fill="#2B241F" stroke="#596C78"/><text x="260" y="31" fill="#A89E8C" font-size="14">DECISION ROWS</text><text x="260" y="62" fill="#F4EADB" font-size="28" font-weight="700">2,200</text>
    <rect x="480" width="220" height="78" rx="10" fill="#2B241F" stroke="#C46D48"/><text x="500" y="31" fill="#A89E8C" font-size="14">DISAGREEMENTS</text><text x="500" y="62" fill="#F4EADB" font-size="28" font-weight="700">700</text>
    <rect x="720" width="396" height="78" rx="10" fill="#2B241F" stroke="#85966D"/><text x="740" y="31" fill="#A89E8C" font-size="14">FINAL HUMAN-AI ACCURACY</text><text x="740" y="62" fill="#F4EADB" font-size="28" font-weight="700">66.61%</text><text x="875" y="61" fill="#7BA38C" font-size="12">experimental sample</text>
  </g>
  <g transform="translate(42 235)">
    <path class="signal" d="M190 58H426M630 58h236" stroke="url(#b)" stroke-width="4" fill="none"/>
    <g><rect width="220" height="116" rx="12" fill="#2B241F" stroke="#D8A25E"/><text x="20" y="28" fill="#D8A25E" font-size="13">STAGE 01</text><text x="20" y="62" fill="#F4EADB" font-size="18" font-weight="700">INITIAL HUMAN</text><text x="20" y="89" fill="#A89E8C" font-size="13">independent judgement</text></g>
    <g transform="translate(440)"><rect width="220" height="116" rx="12" fill="#2B241F" stroke="#596C78"/><text x="20" y="28" fill="#8E9682" font-size="13">STAGE 02</text><text x="20" y="62" fill="#F4EADB" font-size="18" font-weight="700">AI RECOMMENDATION</text><text x="20" y="89" fill="#A89E8C" font-size="13">recommendation presented</text></g>
    <g transform="translate(880)"><rect width="278" height="116" rx="12" fill="#2B241F" stroke="#C46D48"/><text x="20" y="28" fill="#D28B66" font-size="13">STAGE 03</text><text x="20" y="62" fill="#F4EADB" font-size="18" font-weight="700">FINAL HUMAN</text><text x="20" y="89" fill="#A89E8C" font-size="13">retain or revise decision</text></g>
    <circle class="n" cx="326" cy="58" r="7" fill="#D8A25E"/><circle class="n d2" cx="754" cy="58" r="7" fill="#596C78"/>
  </g>
  <text x="42" y="394" fill="#7C756D" font-size="12">Mixed methods · reliance analysis · fairness evaluation · clustered uncertainty · qualitative coding</text>
</svg>
