<svg xmlns="http://www.w3.org/2000/svg" width="554" height="576" viewBox="0 0 554.4 576.2" role="img" aria-labelledby="title desc">
<title id="title">Animated monochrome ASCII portrait of Jithu Vathiath Biju</title>
<desc id="desc">A transparent black-and-white ASCII portrait with contrast-safe rendering for both light and dark backgrounds, plus subtle flicker and horizontal glitch animation.</desc>
<defs>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.35" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="band1"><rect x="0" y="167.1" width="554.4" height="28"/></clipPath>
  <clipPath id="band2"><rect x="0" y="311.1" width="554.4" height="22"/></clipPath>
  <clipPath id="band3"><rect x="0" y="443.7" width="554.4" height="18"/></clipPath>
  <style>
    .portrait{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:8.2px;font-weight:700;fill:#111;stroke:#f4f4f4;stroke-width:.7px;paint-order:stroke fill;white-space:pre;filter:url(#softGlow)}
    .base{animation:flicker 4.8s ease-in-out infinite}
    .g1{opacity:0;animation:glitch1 5.6s steps(1,end) infinite}
    .g2{opacity:0;animation:glitch2 7.2s steps(1,end) infinite}
    .g3{opacity:0;animation:glitch3 6.4s steps(1,end) infinite}
    @keyframes flicker{0%,18%,22%,64%,68%,100%{opacity:.98}20%{opacity:.91}66%{opacity:.94}}
    @keyframes glitch1{0%,35%,38%,100%{opacity:0;transform:translateX(0)}36%{opacity:.78;transform:translateX(5px)}37%{opacity:.45;transform:translateX(-3px)}}
    @keyframes glitch2{0%,58%,61%,100%{opacity:0;transform:translateX(0)}59%{opacity:.62;transform:translateX(-6px)}60%{opacity:.38;transform:translateX(3px)}}
    @keyframes glitch3{0%,79%,82%,100%{opacity:0;transform:translateX(0)}80%{opacity:.55;transform:translateX(4px)}81%{opacity:.35;transform:translateX(-2px)}}
    @media(prefers-reduced-motion:reduce){.base,.g1,.g2,.g3{animation:none}.g1,.g2,.g3{display:none}}
  </style>
</defs>
